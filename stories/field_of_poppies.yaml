title: "The Field of Mysterious Poppies"
start_scene: field_entrance

scenes:
  field_entrance:
    text:
      - "You stand at the edge of a breathtaking field of poppies."
      - "The flowers glow with an ethereal crimson light."
      - "A sweet, intoxicating scent fills the air..."
    art: poppy_field
    choices:
      - text: "Walk deeper into the field"
        next: deeper_field
      - text: "Call out to see if anyone's there"
        next: call_out
      - text: "Look for a path around the field"
        next: find_path

  deeper_field:
    text:
      - "You push through the tall poppy stalks."
      - "The flowers seem to sway and whisper to each other."
      - "Suddenly, a tiny fairy hovers before you!"
    art: fairy
    choices:
      - text: "Ask the fairy for help"
        next: fairy_help
      - text: "Try to catch the fairy"
        next: catch_fairy
      - text: "Ignore her and continue"
        next: ignore_fairy

  call_out:
    text:
      - "Your voice echoes across the field."
      - "The poppies rustle, and an ancient owl lands on a nearby stem!"
    art: owl_tree
    choices:
      - text: "Ask the owl about this place"
        next: owl_wisdom
      - text: "Offer the owl a treat"
        next: owl_treat
      - text: "Shoo the owl away"
        next: shoo_owl

  find_path:
    text:
      - "You search for a way around the field."
      - "Instead, you discover a magnificent unicorn drinking from a hidden stream!"
    art: unicorn
    choices:
      - text: "Approach the unicorn gently"
        next: unicorn_friend
      - text: "Try to ride the unicorn"
        next: unicorn_ride
      - text: "Leave quietly and find another way"
        next: deeper_field

  fairy_help:
    text:
      - "'Brave traveler!' the fairy twinkles."
      - "'Seek the Golden Butterfly - she knows the way to Rocky!'"
    art: fairy_2
    choices:
      - text: "Thank the fairy and search for the butterfly"
        next: golden_butterfly
      - text: "Ask Rocky is a nice name for a creature"
        next: ask_about_rocky
      - text: "Demand the fairy take you there"
        next: demand_fairy

  catch_fairy:
    text:
      - "You lunge, but the fairy zips away laughing!"
      - "The poppies trap you in a whirlwind of petals."
      - "A shadow falls over you... a wolf emerges!"
    art: wolf
    choices:
      - text: "Run away!"
        next: run_from_wolf
      - text: "Stand your ground"
        next: face_wolf
      - text: "Offer the wolf a treat"
        next: wolf_tame

  ignore_fairy:
    text:
      - "You walk past, but the fairy floats after you."
      - "'Wait! I'll help you find Rocky!' she calls."
      - "A mischievous imp appears beside you!"
    art: imp
    choices:
      - text: "Listen to the fairy"
        next: fairy_help
      - text: "Talk to the imp instead"
        next: imp_offer
      - text: "Keep walking"
        next: deeper_field

  owl_wisdom:
    text:
      - "The owl hoots wisely."
      - "'Rocky the Little Bully? Yes, I know him.'"
      - "'Follow the purple poppies to the heart of the field.'"
    art: owl
    choices:
      - text: "Follow the purple poppies"
        next: purple_path
      - text: "Ask why he's called a bully"
        next: owl_explain
      - text: "Thank the owl and leave"
        next: find_path

  owl_treat:
    text:
      - "The owl accepts your offering gratefully."
      - "'A kind heart! I shall guide you to Rocky myself!'"
      - "Follow me!"
    art: owl_fly
    choices:
      - text: "Follow the owl"
        next: owl_guide
      - text: "Ask what Rocky is really like"
        next: owl_explain
      - text: "Change your mind and explore alone"
        next: deeper_field

  shoo_owl:
    text:
      - "The owl hoots angrily and flies away!"
      - "The field grows darker... something approaches."
      - "A pack of shadowy wolves surrounds you!"
    art: wolf
    choices:
      - text: "Climb a poppy stalk"
        next: climb_poppy
      - text: "Fight your way through"
        next: fight_wolves
      - text: "Play dead"
        next: play_dead

  wolf_tame:
    text:
      - "The wolf eats the treat happily!"
      - "'Woof! You're okay! Follow me!'"
      - "The wolf leads you through secret paths!"
    art: wolf
    choices:
      - text: "Follow the wolf"
        next: find_rocky
      - text: "Ask about Rocky's weakness"
        next: wolf_weakness
      - text: "Go your own way"
        next: deeper_field

  face_wolf:
    text:
      - "You stand tall and face the wolf!"
      - "The wolf pauses... then bows its head."
      - "'You have courage, human. I respect that.'"
    art: wolf
    choices:
      - text: "Ask for directions to Rocky"
        next: wolf_guide
      - text: "Offer to be friends"
        next: wolf_friend
      - text: "Still run away"
        next: run_from_wolf

  purple_path:
    text:
      - "The purple poppies form a glowing trail."
      - "Fireflies dance around you as you follow the path."
      - "You hear a grumpy bark!"
    art: path
    choices:
      - text: "Run toward the bark!"
        next: find_rocky
      - text: "Approach cautiously"
        next: cautious_approach
      - text: "Hide and watch first"
        next: spy_rocky

  owl_explain:
    text:
      - "'Rocky is a tiny dog with a mighty growl!'"
      - "'He steals toys from other creatures and hides them!'"
      - "'But secretly, he just wants friends.'"
    art: owl_2
    choices:
      - text: "That's sad, let's find him"
        next: purple_path
      - text: "A bully needs to be taught a lesson"
        next: confront_rocky
      - text: "Find another way home instead"
        next: find_path

  owl_guide:
    text:
      - "The owl flies ahead, hooting encouragement."
      - "Through the sea of red, something small and fluffy appears."
      - "It's... glaring right at you!"
    art: dog_clouds
    choices:
      - text: "Say hello"
        next: find_rocky
      - text: "Prepare for trouble"
        next: confront_rocky
      - text: "Hide behind the owl"
        next: hide_owl

  climb_poppy:
    text:
      - "You scramble up a tall poppy stalk!"
      - "The wolves circle below, growling."
      - "From up here, you see the heart of the field!"
    art: poppy_field
    choices:
      - text: "Jump to another stalk toward the center"
        next: heart_of_field
      - text: "Wait for the wolves to leave"
        next: wait_wolves
      - text: "Climb down and fight"
        next: fight_wolves

  fight_wolves:
    text:
      - "You bravely fight the wolves!"
      - "But there are too many..."
      - "Suddenly, a tiny but angry dog bursts through!"
    art: wolf
    choices:
      - text: "Hide behind the angry dog"
        next: find_rocky
      - text: "Try to befriend the dog"
        next: befriend_rocky
      - text: "Run while they're distracted"
        next: escape_chaos

  play_dead:
    text:
      - "You collapse to the ground..."
      - "The wolves sniff you, then trot away bored."
      - "You hear tiny footsteps approaching..."
    art: poppy_field
    choices:
      - text: "Open your eyes"
        next: find_rocky
      - text: "Stay still"
        next: rocky_curious
      - text: "Jump up and run"
        next: run_away_again

  wolf_friend:
    text:
      - "The wolf licks your face!"
      - "'You want to meet my buddy? He's small but scary!'"
      - "A tiny dog emerges from behind the wolf!"
    art: wolf
    choices:
      - text: "Meet the buddy"
        next: find_rocky
      - text: "Ask about his friend"
        next: wolf_rocky_info
      - text: "This is getting weird, leave"
        next: find_path

  wolf_weakness:
    text:
      - "'Rocky's weakness? He's a softie inside!'"
      - "'Show him kindness and he'll melt!'"
      - "'Also, he loves belly rubs!'"
    art: wolf
    choices:
      - text: "Go find Rocky and try that"
        next: find_rocky
      - text: "That's too much work"
        next: find_path
      - text: "Use it against him"
        next: confront_rocky

  imp_offer:
    text:
      - "The imp grins wickedly."
      - "'I know where Rocky hides! But what's in it for me?'"
      - "'Bring me a golden petal from the heart of the field.'"
    art: imp
    choices:
      - text: "Agree to the imp's deal"
        next: imp_deal
      - text: "Refuse and leave"
        next: deeper_field
      - text: "Try to trick the imp"
        next: trick_imp

  imp_deal:
    text:
      - "'Excellent! Meet me at the heart!' the imp cackles."
      - "He vanishes in purple smoke!"
      - "You continue toward the center..."
    art: imp
    choices:
      - text: "Go to the heart"
        next: heart_of_field
      - text: "Ignore the imp and explore"
        next: deeper_field
      - text: "Search for golden petals"
        next: golden_petals

  trick_imp:
    text:
      - "'Nice try, human!' the imp laughs."
      - "'But I'm trickier than you!'"
      - "He zips away, leaving you alone..."
    art: imp
    choices:
      - text: "Continue exploring"
        next: deeper_field
      - text: "Search for another guide"
        next: find_path
      - text: "Go to the heart alone"
        next: heart_of_field

  unicorn_cautious:
    text:
      - "'Wise choice,' the unicorn seems to say."
      - "It slows down and you approach carefully."
      - "A small but angry dog guards the path!"
    art: unicorn
    choices:
      - text: "Say hello politely"
        next: find_rocky
      - text: "Offer a treat"
        next: treat_rocky
      - text: "Ask permission to pass"
        next: ask_rocky

  unicorn_rocky:
    text:
      - "'Rocky? That little guy!' the unicorn nickers."
      - "'He guards the heart. Can be mean, but...'"
      - "'He just wants someone to play with.'"
    art: unicorn
    choices:
      - text: "Go meet him"
        next: heart_of_field
      - text: "Ask for a gift to bring"
        next: unicorn_gift
      - text: "Continue on without meeting"
        next: find_path

  observe_rocky:
    text:
      - "You watch from behind a poppy..."
      - "The small dog is actually... crying?"
      - "'No one likes me because I'm a bully,' he whimpers."
    art: dog_sad
    choices:
      - text: "Go comfort him"
        next: comfort_rocky
      - text: "Continue watching"
        next: spy_rocky
      - text: "Confront him"
        next: confront_rocky

  cautious_approach:
    text:
      - "You creep forward slowly..."
      - "The dog is small but fierce!"
      - "'BARK! Who are YOU?!'"
    art: dog_angry
    choices:
      - text: "I'm a new friend!"
        next: find_rocky
      - text: "I'm lost, can you help?"
        next: help_rocky
      - text: "I challenge you!"
        next: confront_rocky

  spy_rocky:
    text:
      - "You hide and watch Rocky..."
      - "He plays with stolen toys alone..."
      - "He looks sad when he thinks no one's looking."
    art: dog_lonely
    choices:
      - text: "Reveal yourself and offer friendship"
        next: find_rocky
      - text: "Steal one of his toys"
        next: steal_toy
      - text: "Leave him alone"
        next: find_path

  wait_wolves:
    text:
      - "You wait for hours..."
      - "Finally, the wolves leave!"
      - "A tiny dog has been watching you the whole time!"
    art: wolf
    choices:
      - text: "Talk to the dog"
        next: find_rocky
      - text: "Climb down"
        next: climb_poppy
      - text: "Jump and run"
        next: run_away_again

  escape_chaos:
    text:
      - "You bolt through the chaos!"
      - "The wolves and dog are fighting!"
      - "You find yourself at the heart of the field!"
    art: wolf
    choices:
      - text: "Look around"
        next: heart_of_field
      - text: "Keep running"
        next: find_rocky
      - text: "Hide"
        next: hidden_glade

  rocky_curious:
    text:
      - "The dog pokes you with his nose."
      - "'I know you're awake, human!'"
    art: rocky
    choices:
      - text: "Open your eyes"
        next: find_rocky
      - text: "Stay still"
        next: submit_rocky
      - text: "Jump up!"
        next: confront_rocky

  find_rocky:
    text:
      - "You stand face to face with Rocky!"
      - "He growls and shows his tiny teeth!"
      - "'BARK! What do YOU want?!'"
    art: rocky
    choices:
      - text: "I want to be your friend!"
        next: befriend_rocky
      - text: "I challenge you, little bully!"
        next: confront_rocky
      - text: "I just want to go home"
        next: help_rocky

  befriend_rocky:
    text:
      - "'Friend? Nobody wants to be MY friend!'"
      - "Rocky's eyes soften just a little..."
      - "'You... you really mean it?'"
    art: rocky
    choices:
      - text: "Yes! Let's play!"
        next: play_rocky
      - text: "Of course! You're not so scary!"
        next: comfort_rocky
      - text: "Sure, now help me go home"
        next: help_rocky

  confront_rocky:
    text:
      - "Rocky puffs up his tiny chest!"
      - "'You think you're tough?! Let's see!'"
      - "He charges... and trips over his own feet!"
    art: rocky
    choices:
      - text: "Help him up"
        next: help_rocky
      - text: "Laugh at him"
        next: laugh_rocky
      - text: "Walk away"
        next: walk_away

  treat_rocky:
    text:
      - "You hold out a treat!"
      - "Rocky's nose twitches... his stomach growls."
      - "'Fine... I'll take it. But we're not friends!'"
    art: treat
    choices:
      - text: "We can be friends!"
        next: befriend_rocky
      - text: "That's okay, little guy"
        next: comfort_rocky
      - text: "Just help me find my way"
        next: help_rocky

  apologize_rocky:
    text:
      - "'Sorry?! You're... sorry?'"
      - "Rocky's tail wags slightly!"
      - "'Nobody ever apologizes to me!'"
    art: rocky
    choices:
      - text: "Can we be friends?"
        next: befriend_rocky
      - text: "Will you help me?"
        next: help_rocky
      - text: "What do you want?"
        next: rocky_wants

  compliment_rocky:
    text:
      - "'My collection? You like it?!'"
      - "Rocky's eyes light up!"
      - "'You're not so bad, human!'"
    art: glade
    choices:
      - text: "Want to be friends?"
        next: play_rocky
      - text: "Can you help me?"
        next: help_rocky
      - text: "It's impressive!"
        next: rocky_proud

  submit_rocky:
    text:
      - "'Hah! You submit to the great Rocky!'"
      - "He puffs up proudly."
      - "'Now you must do my bidding!'"
    art: rocky
    choices:
      - text: "Fine, what do you want?"
        next: rocky_wants
      - text: "Actually, never mind"
        next: run_away_again
      - text: "Let's make a deal"
        next: deal_rocky

  run_away_again:
    text:
      - "You try to run, but Rocky blocks your path!"
      - "'Not so fast! You're in MY field now!'"
    art: rocky
    choices:
      - text: "Please, I just want to go home"
        next: help_rocky
      - text: "Fine, what do you want?"
        next: rocky_wants
      - text: "Let's be friends instead"
        next: befriend_rocky

  comfort_rocky:
    text:
      - "You pat Rocky's head gently."
      - "His tail starts wagging!"
      - "'M-maybe we can be... friends?'"
    art: friends
    choices:
      - text: "Absolutely!"
        next: play_rocky
      - text: "Of course!"
        next: rocky_happy
      - text: "Will you help me go home?"
        next: help_rocky

  laugh_rocky:
    text:
      - "You laugh at the silly dog!"
      - "Rocky's face turns red with anger!"
      - "'I'll show you! BARK BARK BARK!'"
    art: rocky
    choices:
      - text: "Sorry! That was mean"
        next: apologize_rocky
      - text: "Calm down, little guy"
        next: calm_rocky
      - text: "Run away!"
        next: run_away_again

  walk_away:
    text:
      - "You turn to leave..."
      - "'Hey! Don't ignore ME!' Rocky chases after you!"
    art: rocky
    choices:
      - text: "Turn back"
        next: find_rocky
      - text: "Keep walking"
        next: walk_away
      - text: "Run!"
        next: run_away_again

  ask_rocky:
    text:
      - "'Ask PERMISSION?!'"
      - "Rocky looks shocked!"
      - "'Nobody asks! Everyone just runs!'"
    art: rocky
    choices:
      - text: "I respect you, so I ask"
        next: respect_rocky
      - text: "Well, can I?"
        next: help_rocky
      - text: "Whatever, moving on"
        next: walk_away

  steal_toy:
    text:
      - "You grab a shiny toy and run!"
      - "'HEY! Thief!' Rocky chases you!"
      - "He catches you and pins you down!"
    art: treat
    choices:
      - text: "I'm sorry!"
        next: apologize_rocky
      - text: "Let's share"
        next: share_toy
      - text: "Fight back"
        next: confront_rocky

  help_rocky:
    text:
      - "'Help you? Hmm...'"
      - "Rocky scratches his head."
      - "'Only if you bring me a treat first!'"
    art: rocky
    choices:
      - text: "Deal!"
        next: deal_rocky
      - text: "I don't have any"
        next: no_treat
      - text: "No thanks"
        next: walk_away

  rocky_happy:
    text:
      - "Rocky's tail wags a million miles an hour!"
      - "'I have a friend! I HAVE A FRIEND!'"
      - "He does happy zoomies around you!"
    art: friends
    choices:
      - text: "You're the best, Rocky!"
        next: rocky_helps
      - text: "Let's be partners!"
        next: explore_together
      - text: "Thanks for being my friend"
        next: best_friends

  rocky_wants:
    text:
      - "'What do I want?' Rocky thinks hard."
      - "'I want... someone to play with.'"
      - "'And maybe... maybe some belly rubs?'"
    art: rocky
    choices:
      - text: "We can do that!"
        next: play_rocky
      - text: "I can help you!"
        next: comfort_rocky
      - text: "That's... it?"
        next: surprise_rocky

  rocky_proud:
    text:
      - "'Of course it's impressive!' Rocky puffs up."
      - "'I worked VERY hard on it!'"
      - "'You have good taste, human!'"
    art: rocky
    choices:
      - text: "Thanks! Want to be friends?"
        next: befriend_rocky
      - text: "You should share sometimes"
        next: share_advice
      - text: "It's nice!"
        next: rocky_happy

  deal_rocky:
    text:
      - "'Deal! Shake on it!'"
      - "Rocky extends his tiny paw!"
      - "'You're okay, human!'"
    art: friends
    choices:
      - text: "Shake paws!"
        next: play_rocky
      - text: "Now help me please"
        next: rocky_helps
      - text: "What else do you want?"
        next: rocky_wants

  no_treat:
    text:
      - "'No treat?! Then no help!'"
      - "Rocky crosses his little arms."
      - "'Unless... you give me a hug?'"
    art: rocky
    choices:
      - text: "Okay, here's a hug"
        next: hug_rocky
      - text: "That's weird, no"
        next: walk_away
      - text: "How about a belly rub?"
        next: belly_rub

  respect_rocky:
    text:
      - "'You... you really respect me?'"
      - "Rocky's eyes get watery!"
      - "'You're the first one who ever did!'"
    art: rocky
    choices:
      - text: "Of course, Rocky"
        next: comfort_rocky
      - text: "You're the boss here"
        next: rocky_happy
      - text: "Can I pass now?"
        next: help_rocky

  calm_rocky:
    text:
      - "'C-calm down? I AM calm!'"
      - "Rocky takes a deep breath."
      - "'...You're right. I'm overreacting.'"
    art: rocky
    choices:
      - text: "It's okay, Rocky"
        next: comfort_rocky
      - text: "Want to be friends?"
        next: befriend_rocky
      - text: "Let me pass"
        next: help_rocky

  share_toy:
    text:
      - "'Share?! You want to SHARE?!'"
      - "Rocky's jaw drops!"
      - "'N-no one's ever wanted to share with me!'"
    art: treat
    choices:
      - text: "Friends share things!"
        next: play_rocky
      - text: "Here, you can have it back"
        next: give_back
      - text: "Let's play together"
        next: explore_together

  give_back:
    text:
      - "You hand Rocky his toy back."
      - "He looks at you with pure shock!"
      - "'You're... you're really nice!'"
    art: friends
    choices:
      - text: "Want to be friends?"
        next: play_rocky
      - text: "No problem!"
        next: rocky_happy
      - text: "Will you help me now?"
        next: rocky_helps

  surprise_rocky:
    text:
      - "'That IT?! That's EVERYTHING to me!'"
      - "Rocky looks hurt..."
      - "'You don't understand anything!'"
    art: rocky
    choices:
      - text: "I'm sorry, explain it to me"
        next: explain_rocky
      - text: "I understand now!"
        next: comfort_rocky
      - text: "Whatever, just help me"
        next: help_rocky

  explain_rocky:
    text:
      - "'I... I just wanted friends,' Rocky sniffles."
      - "'But everyone thinks I'm scary!'"
      - "'So I act mean to protect myself!'"
    art: rocky
    choices:
      - text: "I understand now!"
        next: comfort_rocky
      - text: "That's so sad!"
        next: sad_rocky
      - text: "Let's change that!"
        next: play_rocky

  share_advice:
    text:
      - "'Share? But then they might take my stuff!'"
      - "Rocky looks worried..."
      - "'Or... they might like me more?'"
    art: rocky
    choices:
      - text: "Exactly! Try it!"
        next: play_rocky
      - text: "Maybe..."
        next: rocky_unsure
      - text: "That's how friends work"
        next: explain_rocky

  hug_rocky:
    text:
      - "You give Rocky a big hug!"
      - "He freezes... then melts!"
      - "'N-no one's ever hugged me before!'"
    art: friends
    choices:
      - text: "I can be your friend!"
        next: play_rocky
      - text: "You're my buddy now!"
        next: rocky_happy
      - text: "Will you help me?"
        next: rocky_helps

  belly_rub:
    text:
      - "'B-belly rub?! Only if you mean it!'"
      - "Rocky rolls over nervously..."
      - "His tail wags a little!"
    art: friends
    choices:
      - text: "*rub rub rub*"
        next: belly_rub_happy
      - text: "Only if you help me"
        next: deal_rocky
      - text: "Maybe later"
        next: help_rocky

  belly_rub_happy:
    text:
      - "Rocky is in heaven!"
      - "'OKAY! OKAY! I'll help you!'"
      - "'Anything for my best friend!'"
    art: friends
    choices:
      - text: "Thank you, Rocky!"
        next: rocky_helps
      - text: "Best friends forever!"
        next: best_friends
      - text: "You're the best!"
        next: rocky_happy

  rocky_helps:
    text:
      - "'Alright, follow me!'"
      - "Rocky leads you through secret paths!"
      - "The poppies part to reveal the edge of the field!"
    art: friends
    choices:
      - text: "Thank you, Rocky!"
        next: say_goodbye
      - text: "Will I see you again?"
        next: see_again
      - text: "Let's explore more!"
        next: explore_together

  explore_together:
    text:
      - "You and Rocky explore the magical field!"
      - "You find hidden streams, secret caves..."
      - "And most importantly, a true friend!"
    art: friends
    choices:
      - text: "This is amazing!"
        next: adventure_continue
      - text: "Let's go home together"
        next: say_goodbye
      - text: "Best day ever!"
        next: best_friends

  sad_rocky:
    text:
      - "'It's okay,' Rocky sniffs."
      - "'I have you now!'"
      - "'Will you be my friend?'"
    art: rocky
    choices:
      - text: "Always!"
        next: play_rocky
      - text: "Of course!"
        next: rocky_happy
      - text: "Forever!"
        next: best_friends

  rocky_unsure:
    text:
      - "'Maybe... you're right,' Rocky ponders."
      - "'Maybe sharing isn't so bad.'"
    art: rocky
    choices:
      - text: "Try it with me!"
        next: play_rocky
      - text: "You won't regret it!"
        next: comfort_rocky
      - text: "Trust me!"
        next: best_friends

  hidden_glade_meet:
    text:
      - "Rocky looks at you suspiciously..."
      - "'You're not running away?'"
      - "'Or trying to steal my stuff?'"
    art: glade
    choices:
      - text: "I just want to talk"
        next: befriend_rocky
      - text: "I like your collection!"
        next: compliment_rocky
      - text: "Can I join you?"
        next: join_rocky

  join_rocky:
    text:
      - "'Join ME?!'"
      - "Rocky's eyes go wide!"
      - "'I mean... I guess... okay!'"
    art: friends
    choices:
      - text: "Yay! Friends!"
        next: play_rocky
      - text: "Thanks, Rocky!"
        next: rocky_happy
      - text: "Let's play!"
        next: explore_together
